[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3"
dynamic = ["version"]
description = "SAM3 (Segment Anything Model 3) implementation"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Meta AI Research"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "timm>=1.0.17",
    "numpy==1.26",
    "tqdm",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "huggingface_hub",
    "opencv-python>=4.11.0.86",
    "submitit>=1.5.3",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "einops>=0.8.1",
    # decord: no aarch64 wheel. Linux x86_64 reports platform_machine 'x86_64';
    # Windows x64 reports 'AMD64' (not 'x86_64').
    "decord>=0.6.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "pycocotools>=2.0.10",
    "psutil>=7.1.3",
    "tensorboard>=2.20.0",
    "torchmetrics>=1.8.2",
    "scipy>=1.16.3",
    "fvcore>=0.1.5.post20221221",
    "matplotlib>=3.10.7",
    "nbdev>=3.0.17",
    "gradio>=6.14.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black==24.2.0",
    "ufmt==2.8.0",
    "ruff-api==0.1.0",
    "usort==1.0.2",
    "gitpython==3.1.31",
    "yt-dlp",
    "pandas",
    "opencv-python",
    "pycocotools",
    "numba",
    "python-rapidjson",
]
notebooks = [
    "matplotlib",
    "jupyter",
    "notebook",
    "ipywidgets",
    "ipycanvas",
    "ipympl",
    "pycocotools",
    "decord; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "opencv-python",
    "einops",
    "scikit-image",
    "scikit-learn",
]
train = [
    "hydra-core",
    "submitit",
    "tensorboard",
    "zstandard",
    "scipy",
    "torchmetrics",
    "fvcore",
    "fairscale",
    "scikit-image",
    "scikit-learn",
]

sambaunet = [
    "transformers>=4.44",
]

[project.scripts]
sam3-dataset = "sam3_fine_tune.dataset.cli:main"
sam3-finetune = "sam3_fine_tune.finetune.cli:main"
sam3-infer = "sam3_fine_tune.inference.cli:main"
sam3-prepare = "sam3_fine_tune.prepare.cli:main"

[project.urls]
"Homepage" = "https://github.com/facebookresearch/sam3"
"Bug Tracker" = "https://github.com/facebookresearch/sam3/issues"

# Was only packages = ["sam3", "sam3.model"] → `from sam3.sam...` failed (sam3.sam not installed).
[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"sam3_fine_tune.dataset" = ["conf/*.yaml"]
"sam3_fine_tune.inference" = ["conf/*.yaml"]
"sam3_fine_tune.prepare" = ["conf/*.yaml"]
"sam3_fine_tune.sambaunet" = ["conf/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "sam3.__version__"}

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.usort]
first_party_detection = false

[tool.ufmt]
formatter = "ruff-api"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "timm.*",
    "numpy.*",
    "PIL.*",
    "tqdm.*",
    "ftfy.*",
    "regex.*",
    "iopath.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
