# @package _global_
defaults:
  - _self_

# ============================================================================
# Paths Configuration 
# ============================================================================
paths:
  # (Ha) Changed 2026-07-20: bondwire categories regenerated with gate-pad gap
  # bridging (see sam3_fine_tune/preprocessing/split_multiclass_masks.py and
  # CHANGELOG.md 2026-07-20). thin_wire instances split by gate_pad priority
  # are now merged into single annotations before COCO conversion.
  pin_dir_root: /home/hpc_storage/data/projects/userB/sam3_data/9cat_separated_wires_v3_unique_panda
  # (Ha) Changed 2026-07-24: 2-GPU multi-GPU variant of the 9-category unique-panda
  # run on the gpu queue. Uses category_chunk_size=8 and train_batch_size=4 per GPU.
  experiment_log_dir: /home/hpc_storage/data/projects/userB/test_sam3/sam3_fine_tune/experiments/9cat_unique_panda_2gpu_gpuq
  bpe_path: /home/hpc_storage/data/projects/userA/sam3_fine_tune/asset/bpe_simple_vocab_16e6.txt.gz

#dataset configuration
pin_train:
  num_images: null 

  # Training transforms pipeline
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 5
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  loss:
     _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
     matcher: ${scratch.matcher}
     o2m_weight: 2.0
     o2m_matcher:
       _target_: sam3.train.matcher.BinaryOneToManyMatcher
       alpha: 0.3
       threshold: 0.4
       topk: 4
     use_o2m_matcher_on_o2m_aux: false
     loss_fns_find:
       - _target_: sam3.train.loss.loss_fns.Boxes
         weight_dict:
           loss_bbox: 5.0
           loss_giou: 2.0
       - _target_: sam3.train.loss.loss_fns.IABCEMdetr
         weak_loss: False
         weight_dict:
           loss_ce: 20.0
           presence_loss: 20.0
         pos_weight: 10.0 
         alpha: 0.25
         gamma: 2
         use_presence: True  
         pos_focal: false
         pad_n_queries: 200
         pad_scale_pos: 1.0
       - _target_: sam3.train.loss.loss_fns.Masks
         focal_alpha: 0.25
         focal_gamma: 2.0
         weight_dict:
           loss_mask: 20.0  
           loss_dice: 10.0
           # (Ha) Added 2026-07-19: soft clDice loss (Shit et al., CVPR 2021) --
           # a topology-preserving loss for thin/tubular structures (bond
           # wires). Motivated by visual review of thick_wire/thin_wire
           # predictions showing blobby, imprecise boundaries AND masks
           # fragmented into disconnected pieces for a single wire instance --
           # standard dice/mask (BCE) losses barely penalize either failure
           # mode since a thin object's total pixel count is tiny. clDice
           # scores based on skeleton (centerline) recall/precision instead of
           # raw pixel overlap, directly penalizing both boundary imprecision
           # and connectivity breaks. See sam3/train/loss/loss_fns.py's
           # soft_cldice_loss() docstring and nbs/11_debug_per_category_ap_investigation.ipynb
           # for the full "computer vision expert panel" rationale.
           # REVERTED 2026-07-20: job 238286332 (full 10-epoch run with this
           # loss active) came back WORSE for the exact category clDice
           # targets most: thin_wire AP dropped 0.675->0.376, while
           # thick_wire/gate_pad stayed roughly flat and the aggregate
           # regressed 0.833->0.783. Per-instance mask IoU analysis (same
           # images, before/after) showed detection confidence was unchanged
           # (0.88-0.96 both runs) but predicted mask SHAPE precision cratered
           # (mean best-match IoU 0.910 -> 0.727) -- likely the
           # downsample_size=128 skeletonization (needed to avoid OOM)
           # destroying too much fine boundary detail for a ~26px-wide wire.
           # Ruled out category confusion with gate_pad (zero GT pixel
           # overlap; detection confidence unaffected) via
           # nbs/11_debug_per_category_ap_investigation.ipynb Step 14/15.
           # Commented out -- uncomment `loss_cldice: 15.0` below to
           # re-enable (no other code/config change needed either way, see
           # Masks.compute_cldice in loss_fns.py).
           # loss_cldice: 15.0
         compute_aux: false
     loss_fn_semantic_seg:
       _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
       presence_head: True
       presence_loss: False  
       focal: True
       focal_alpha: 0.6
       focal_gamma: 2.0
       downsample: False
       weight_dict:
         loss_semantic_seg: 20.0
         loss_semantic_presence: 1.0
         loss_semantic_dice: 30.0
     scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Different helper parameters and functions
# ============================================================================
scratch:
  enable_segmentation: True 
  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1  
    use_original_ids: true
    #use_original_sizes_box: true     
    iou_type: "segm"               
    use_original_sizes_mask: true   
    use_presence: ${scratch.use_presence_eval}

  # Matcher configuration
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true  
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False    
  scale_by_find_batch_size: True

  # Image processing parameters
  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 50       

  # Normalization parameters
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  # Training parameters
  num_train_workers: 4      
  # (Ha) Increased 0->4 (2026-07-20), matching num_train_workers: validation
  # was running with num_val_workers=0 (synchronous, single-process data
  # loading), which fully serializes CPU-side image/mask decode + transforms
  # in front of every GPU step instead of overlapping it with compute --
  # confirmed via job 238286332's val log showing Data Time ~1.1-1.9s out of
  # every ~6s step (20-30% pure CPU-bound stall, vs. train's Data Time
  # ~0.00-0.01s with 4 background workers prefetching). Should meaningfully
  # cut validation wall-clock time with no effect on metrics.
  num_val_workers: 4
  max_data_epochs: 10   
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Learning rate and scheduler parameters
  lr_scale: 1   
  lr_transformer_decoder: ${times:3e-4,${scratch.lr_scale}}
  lr_transformer_encoder: ${times:1e-4,${scratch.lr_scale}} 
  lr_vision_backbone: ${times:5e-5,${scratch.lr_scale}} 
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lr_geometry_encoder: ${times:1e-4,${scratch.lr_scale}} 
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  val_batch_size: 3 
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: pin
    with_seg_masks: true 

  gradient_accumulation_steps: 2 
  # (Ha) Reverted 2026-07-18: back to the validated-safe production value of 4
  # (was temporarily dropped to 2 only to give the SAM3_NAN_DEBUG_HOOKS=1
  # forward-hook instrumentation memory headroom during the GradScaler/bf16
  # zero-loss-collapse investigation -- see .github/skills/loss-debugging/SKILL.md
  # Step 10 and nbs/10_debug_zero_loss_collapse.ipynb. That investigation is
  # concluded and validated (job 237950477 ran clean well past the collapse
  # point), so the debug settings are no longer needed for this run.
  train_batch_size: 2 
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: true 

# ============================================================================
# Trainer Configuration
# ============================================================================

trainer:

  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: False
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: True
  max_epochs: 10 
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 5    
  mode: train       
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${pin_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        limit_ids: ${pin_train.num_images}
        transforms: ${pin_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:                          
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true                   
          category_chunk_size: 8
          _partial_: true
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: False
        img_folder: ${paths.pin_dir_root}/train/images/
        # (Ha) Added 2026-07-19: use annotation_merged.json, not the original
        # annotation.json -- see CHANGELOG.md 2026-07-19 "split-photo
        # contradictory negatives" finding. The original file has each of the
        # 662 shared bondwire photos split into 3 separate COCO image entries
        # (one per thick_wire/thin_wire/gate_pad), each carrying ONLY its own
        # category's annotations -- creating systematically contradictory
        # negative supervision for these 3 categories (each entry implicitly
        # asserts the other 2 categories are absent from a photo where they're
        # actually present). .github/scripts/merge_duplicate_photo_entries.py
        # consolidates each group of duplicate-photo entries into one image
        # entry carrying the union of all its categories' annotations, with
        # zero annotation loss (verified: per-category counts identical
        # before/after).
        ann_file: ${paths.pin_dir_root}/train/annotation_merged.json

      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}
      gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          category_chunk_size: 8 
          _partial_: true
        img_folder: ${paths.pin_dir_root}/test/images/
        # (Ha) Added 2026-07-19: see matching train ann_file comment above.
        ann_file: ${paths.pin_dir_root}/test/annotation_merged.json
        transforms: ${pin_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false

      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn: ${scratch.collate_fn_val}


  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false    
    enable_segmentation: true 
    load_from_HF: false
    checkpoint_path: /home/hpc_storage/data/projects/userA/sam3_fine_tune/asset/sam3.pt


  meters:
    val:
      pin:
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/pins
          merge_predictions: True
          postprocessor: ${scratch.original_box_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.pin_dir_root}/test/annotation_merged.json
              tide: False
              iou_type: "segm"      
            # (Ha) Added 2026-07-19: automatic per-category AP/AR breakdown +
            # one overlay JPEG "poster" per category, every validation epoch --
            # no more manually running .github/scripts/per_category_coco_eval.py
            # after training. Categories are discovered DYNAMICALLY from
            # gt_path's own category list (COCO(gt_path).getCatIds()), so a
            # newly-added category is automatically picked up with zero config
            # changes. See sam3/eval/per_category_eval.py docstring and
            # nbs/11_debug_per_category_ap_investigation.ipynb for why this was
            # needed (the aggregate-only metric above was masking very uneven
            # per-category performance -- e.g. thick_wire/thin_wire/gate_pad
            # scored 0.19-0.37 AP while the aggregate read 0.657).
            - _target_: sam3.eval.per_category_eval.PerCategoryEvalWithOverlays
              gt_path: ${paths.pin_dir_root}/test/annotation_merged.json
              img_folder: ${paths.pin_dir_root}/test/images/
              overlay_dir: ${launcher.experiment_log_dir}/dumps/category_overlays
              iou_type: "segm"
              num_overlay_samples: 1
              score_threshold: 0.2

  optim:
    # (Ha) Added 2026-07-20: switch between fine-tuning the FULL model (every
    # param group below in `options.lr` stays trainable) and fine-tuning ONLY
    # the decoder/segmentation head (freezes vision_backbone, language_backbone,
    # geometry_encoder, and transformer.encoder via requires_grad=False -- see
    # Trainer._maybe_freeze_non_decoder_params() in sam3/train/trainer.py).
    #   train_full_model: True  -> full model training (current default/behavior)
    #   train_full_model: False -> decoder-only fine-tuning (faster, less memory,
    #                              useful for quick iteration once the backbone
    #                              is already well-adapted to this data)
    # No other config change is needed to switch modes -- the same 5 LR param
    # groups below still apply; frozen groups just never receive a gradient.
    train_full_model: True
    decoder_only_trainable_patterns:
      - 'transformer.decoder.*'
      - 'dot_prod_scoring.*'
      - 'segmentation_head.*'
    amp:
      enabled: True
      amp_dtype: bfloat16
      # (Ha) Added 2026-07-18: bypass GradScaler's dynamic scale growth/backoff
      # for bfloat16 by default -- see .github/skills/loss-debugging/SKILL.md
      # Step 9/10 for the full investigation. GradScaler was designed for
      # float16's narrow ~5-bit exponent range, which genuinely needs loss
      # scaling to avoid gradient underflow; bfloat16 has the SAME exponent
      # range as fp32 and never needed scaling in the first place.
      # Confirmed root cause (job 237937642, step 9766): scaler.get_scale()
      # had decayed to 2.94e-39 (~143 consecutive backoff halvings, into fp32
      # SUBNORMAL territory) at the exact moment backbone.vision_backbone.
      # trunk.patch_embed.proj's weights went 100% NaN. Once the scale itself
      # degenerates into a subnormal float, the scale/unscale round-trip
      # (loss * scale, later grad / scale) is numerically unstable in its own
      # right, regardless of whether the underlying gradient was ever
      # actually bad -- that instability is what corrupted the weights.
      # Default True: keep GradScaler's found-inf skip-step safety net (the
      # unscale_()+step() mechanism that skips an optimizer step on a
      # non-finite gradient), but PIN the scale at (effectively) a constant
      # 1.0 forever (near-identity growth/backoff factors + an
      # astronomically large growth_interval -- torch.amp.GradScaler's
      # constructor hard-asserts growth_factor > 1.0 and backoff_factor < 1.0,
      # so a literal 1.0 is rejected) instead of letting it spiral into
      # subnormal territory. Set to False to restore the original dynamic
      # scale behavior (not recommended -- this is the confirmed bug).
      bypass_dynamic_scale_for_bf16: True

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1       
      norm_type: 2

    options:
      lr:
        - scheduler: 
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer_decoder}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:                               
            - 'transformer.decoder.*'   
            - 'dot_prod_scoring.*'
            - 'segmentation_head.*'   
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_geometry_encoder}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'geometry_encoder.*'
        
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer_encoder}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'transformer.encoder.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 5  
    # (Ha) Added, 2026-07-17: enables the existing (but previously unused) best-checkpoint
    # mechanism in trainer.py, so a checkpoint_val_pin_detection_<metric>.pt is kept
    # whenever validation AP/AR improves, instead of only the latest checkpoint.pt
    # (which can get overwritten with a post-collapse/regressed state).
    save_best_meters: ["val_pin/detection"]
    # (Ha) Added, 2026-07-17: restrict to ONLY the primary AP metric so a
    # validation improving all ~9 AP/AR sub-metrics at once (e.g. the very
    # first validation, before any best is recorded) doesn't write ~9
    # sequential ~10GB checkpoints back-to-back — that stretch of near-zero
    # GPU utilization tripped this HPC's idle-GPU auto-kill policy
    # (TERM_OWNER / exit 143) during a real repro run (jobs 237539252,
    # 237570479). Only coco_eval_segm_AP is tracked for checkpoint-saving
    # purposes now; other sub-metrics are still logged/tracked in
    # best_meter_values, just don't trigger a save on their own.
    save_best_meter_subkeys: ["coco_eval_segm_AP"]
    model_weight_initializer: null

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10

# ============================================================================
# Launcher and Submitit Configuration
# ============================================================================

launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: False  
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
 