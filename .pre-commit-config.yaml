# One-time setup: `uvx pre-commit install`. Mirrors CI (.github/workflows/standards.yml).
default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
      - id: ufmt
        name: ufmt (black + usort)
        language: python
        additional_dependencies: [ufmt==2.9.1, ruff-api==0.1.0, black==24.2.0, usort==1.0.2]
        entry: ufmt format
        types: [python]
        files: ^(tests/|sam3_fine_tune/(compare|dataset|finetune|sambaunet|inference|prepare)/(?!decoder_inference\.py))
      - id: repo-standards
        name: mechanical repo rules
        language: system
        entry: .venv/bin/python -m pytest tests/test_repo_standards.py -q
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (sam3-infer)
        language: python
        additional_dependencies: [mypy==1.13.0, numpy, omegaconf, hydra-core, types-Pillow, types-PyYAML]
        entry: mypy  # flags live in [tool.mypy] in pyproject.toml
        files: ^sam3_fine_tune/(inference/(run|cli|score)|prepare/(ops|cli|ingest|unveil_view)|compare/(ops|cli))\.py$
