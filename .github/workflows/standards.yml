name: Standards
on:
  pull_request:
  push:
    branches: [main]
jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pre-commit
      - name: Mechanical repo rules
        run: pytest tests/test_repo_standards.py -q
      - name: Formatting and types (same hooks and file lists as local pre-commit)
        run: pre-commit run ufmt --all-files && pre-commit run mypy --all-files
